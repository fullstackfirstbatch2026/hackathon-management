services:
  mysql:
    image: mjayashree08/management-mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-hackathon_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "3307:3306"
    volumes:
      - management_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: mjayashree08/management-api:latest
    build:
      context: ./management
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-hackathon_db}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "8098:8098"

  frontend:
    image: mjayashree08/management-frontend:latest
    build:
      context: ./hackathon-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8082:80"

volumes:
  management_mysql_data:
